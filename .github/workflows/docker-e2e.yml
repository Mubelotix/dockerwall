name: Docker E2E

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install firewall dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes ipset
      - run: docker info
      - run: ./test.sh
